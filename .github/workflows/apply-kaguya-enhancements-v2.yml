name: Apply Kaguya personality, emotions and command guide (v2)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download repository source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Apply Kaguya personality, phrases, commands and emotion patch
        run: python apply-kaguya-enhancements-v2.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Typecheck and build production app
        run: pnpm build

      - name: Create a reviewable pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: fix/kaguya-personality-emotions-v2
          delete-branch: true
          title: "Fix Kaguya personality, Kiu identity, emotions and command guide"
          body: |
            ## Kaguya v2 enhancements

            - Give Kaguya a natural, proud, arrogant, witty voice and a warmer, flirtier voice with the verified Kiu account.
            - Respect the verified numeric Telegram ID for owner recognition and owner-only AI controls.
            - Use the existing phrase corpus contextually instead of letting owner-specific phrases replace every topical response.
            - Add `/ia estado`, `/ia off`, `/ia on` and `/ia alternar`; keep commands and local phrases available when generative AI is off.
            - Add descriptions for the commands in `/help`.
            - Add contextual GIF reactions for affection, playful jealousy, irritation, goodbyes and loneliness after inactivity.
            - Verify dependencies, automated tests, typecheck and production build before merge.

            Review the patch and CI before merging. Configure `KAGUYA_KIU_TELEGRAM_IDS` in Render after merge.
          base: main
