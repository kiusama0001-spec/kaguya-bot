name: Apply Kaguya personality and emotions

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download repository source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Apply Kaguya's personality and emotion patch
        run: python apply-kaguya-enhancements.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Typecheck and build production app
        run: pnpm build

      - name: Create a reviewable pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: fix/kaguya-personality-emotions
          delete-branch: true
          title: "Fix Kaguya personality, Kiu identity and emotional GIFs"
          body: |
            ## Kaguya enhancements

            - Give Kaguya a proud, arrogant, witty and playful voice, while making her warm, affectionate and flirty with the verified Kiu account.
            - Add owner-only `/ia estado`, `/ia off`, `/ia on` and `/ia alternar` commands.
            - Keep phrase-bank replies and local commands available when generative AI is off.
            - Add contextual GIF reactions for affection, teasing, jealousy, irritation and goodbye.
            - Let Kaguya send a playful loneliness/ignored GIF to Kiu after inactivity; persist the interaction and cooldown using the existing activity log.
            - React playfully when someone explicitly flirts with Kiu in a group or replies directly to his message.

            This PR was generated by the repository's own workflow. Review the diff and CI before merging.
          base: main
